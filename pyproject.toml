[project]
name = "news-core"
version = "0.1.0"
description = "Multilingual equity-research news ingestion: locale-aware fetch, tier scoring, translation+gloss, cross-language dedup."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "anthropic>=0.40",
    "tenacity>=8.2",
    "python-dateutil>=2.9",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
deepl = ["deepl>=1.18"]
tavily = ["tavily-python>=0.5"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["news_core"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
markers = [
    "live: integration test requiring live API keys (run with `pytest -m live`)",
]
